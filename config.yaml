# Matching settings
matching:
  min_match_score: 0.3
  top_k: 20

# Output settings
output:
  jobs_csv: "data/jobs.csv"
  report_md: "data/report.md"

# Retry settings
retry:
  max_attempts: 3
  backoff_seconds: 2
